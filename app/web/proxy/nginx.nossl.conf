server {
    listen 80;
    listen [::]:80;
    server_name tradeforge.bot *.tradeforge.bot;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Use Docker's internal DNS so nginx re-resolves fastapi-web after redeploys
    resolver 127.0.0.11 valid=10s;
    set $upstream http://fastapi-web:8080;

    location / {
        proxy_pass $upstream;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitoring routes — uncomment when docker-compose.monitoring.yml is running
    location /pgadmin {
        proxy_pass http://db-admin/;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
    }

    location /portainer/ {
        proxy_pass https://portainer:9443/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /flower/ {
        proxy_pass http://celery-flower:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /prometheus/ {
