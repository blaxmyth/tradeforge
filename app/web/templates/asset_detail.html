{% extends "layout.html" %}

{% block content %}
<div class="asset-label" style="margin-bottom: 16px;">
    <h2><a href="/assets">Assets</a> >> {{ asset.symbol }} >> {{ asset.name }}</h2>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        {% if on_watchlist %}
        <a href="/delete_from_watchlist/{{ asset.id }}" class="ui mini red basic button">
            <i class="star icon"></i> Remove from Watchlist
        </a>
        {% else %}
        <a href="/add_to_watchlist/{{ asset.id }}" class="ui mini teal basic button">
            <i class="star outline icon"></i> Add to Watchlist
        </a>
        {% endif %}
        <form method="POST" action="/apply_strategy" style="display:inline-flex; gap:6px; align-items:center; margin:0;">
            <select name="strategy_id" class="ui dropdown">
                {% for strategy in strategies %}
                <option value="{{strategy.id}}">{{strategy.name}}</option>
                {% endfor %}
            </select>
            <input type="hidden" name="asset_id" value="{{ asset.id }}">
            <input type="submit" value="Apply Strategy" class="ui mini button">
        </form>
    </div>
</div>

<div style="display:flex; align-items:center; gap:16px; margin-bottom:8px; flex-wrap:wrap;">
    <div class="ui small buttons">
        <button class="ui button tf-btn active" data-tf="1min">1 Min</button>
        <button class="ui button tf-btn" data-tf="5min">5 Min</button>
        <button class="ui button tf-btn" data-tf="15min">15 Min</button>
        <button class="ui button tf-btn" data-tf="1hr">1 Hr</button>
        <button class="ui button tf-btn" data-tf="1day">1 Day</button>
    </div>
    <div style="display:flex; gap:4px; flex-wrap:wrap; align-items:center;">
        <button class="ind-btn" data-ind="emas"   style="background:#ff9800;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">EMA</button>
        <button class="ind-btn" data-ind="bbands" style="background:#e6b800;color:#000;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">BB</button>
        <button class="ind-btn" data-ind="rsi"    style="background:#e91e63;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">RSI</button>
        <button class="ind-btn" data-ind="macd"   style="background:#2196f3;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">MACD</button>
        <button class="ind-btn" data-ind="stoch"  style="background:#4caf50;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">Stoch</button>
        <button class="ind-btn" data-ind="adx"    style="background:#9c27b0;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">ADX</button>
        <span style="color:#555;margin:0 2px;">|</span>
        <input id="ema-input" type="number" min="2" max="500" placeholder="period"
               style="width:64px;background:#1e222d;color:#d1d4dc;border:1px solid #333;border-radius:4px;padding:3px 6px;font-size:12px;">
        <button id="ema-add-btn" style="background:#ff9800;color:#fff;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:12px;">+ EMA</button>
        <div id="ema-chips" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
    </div>
</div>

<div id="chart-container" style="width:100%;height:400px;overflow:hidden;"></div>
<div id="rsi-pane"   class="ind-pane" style="width:100%;height:100px;overflow:hidden;position:relative;"><span class="pane-label">RSI(14)</span></div>
<div id="macd-pane"  class="ind-pane" style="width:100%;height:120px;overflow:hidden;position:relative;"><span class="pane-label">MACD(12,26,9)</span></div>
<div id="stoch-pane" class="ind-pane" style="width:100%;height:100px;overflow:hidden;position:relative;"><span class="pane-label">Stoch(14,3,3)</span></div>
<div id="adx-pane"   class="ind-pane" style="width:100%;height:100px;overflow:hidden;position:relative;"><span class="pane-label">ADX(14)</span></div>
<div id="chart-status" style="color:#999;font-size:12px;margin:6px 0 20px;"></div>

<table class="ui striped compact table">
    <thead>
        <tr>
            <th>Time (ET)</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
        </tr>
    </thead>
    <tbody id="price-tbody">
        <tr><td colspan="6" style="text-align:center; color:#999;">Loading…</td></tr>
    </tbody>
</table>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const SYMBOL = "{{ asset.symbol }}";

const DARK = {
    bg:     '#1a1a2e',
    text:   '#d1d4dc',
    grid:   '#2a2a3e',
    border: '#2a2a3e',
};

const BASE_OPTS = {
    layout:          { background: { color: DARK.bg }, textColor: DARK.text },
    grid:            { vertLines: { color: DARK.grid }, horzLines: { color: DARK.grid } },
    rightPriceScale: { borderColor: DARK.border },
    crosshair:       { mode: LightweightCharts.CrosshairMode.Normal },
};

// ── Main chart ──────────────────────────────────────────────────
const mainEl = document.getElementById('chart-container');
const mainChart = LightweightCharts.createChart(mainEl, {
    ...BASE_OPTS,
    width:     mainEl.clientWidth,
    height:    400,
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: DARK.border },
});

const candleSeries = mainChart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});

const SO = { priceLineVisible: false, lastValueVisible: false };

// ── Dynamic EMA series ────────────────────────────────────────────
const EMA_COLORS  = ['#ff9800','#2196f3','#9c27b0','#26a69a','#ef5350','#e6b800','#00bcd4','#ff5722'];
const emaSeries   = {};   // period (int) → LineSeries
let   emasVisible = true;

function emaColor(period) {
    const order = Object.keys(emaSeries).map(Number).sort((a,b)=>a-b);
    const idx   = order.indexOf(period);
    return EMA_COLORS[idx % EMA_COLORS.length];
}

function renderEmaChips() {
    const container = document.getElementById('ema-chips');
    container.innerHTML = '';
    Object.keys(emaSeries).map(Number).sort((a,b)=>a-b).forEach(period => {
        const color = emaColor(period);
        const chip  = document.createElement('span');
        chip.style.cssText = `display:inline-flex;align-items:center;gap:4px;background:${color}22;
            border:1px solid ${color};border-radius:4px;padding:2px 7px;font-size:11px;color:${color};`;
        chip.innerHTML = `EMA${period} <span style="cursor:pointer;font-size:13px;line-height:1;" data-period="${period}">×</span>`;
        chip.querySelector('span').addEventListener('click', () => removeEma(period));
        container.appendChild(chip);
    });
}

function addEma(period) {
    if (emaSeries[period]) return;
    const color  = EMA_COLORS[Object.keys(emaSeries).length % EMA_COLORS.length];
    emaSeries[period] = mainChart.addLineSeries({ ...SO, color, lineWidth: 1 });
    emaSeries[period].applyOptions({ visible: emasVisible });
    renderEmaChips();
    loadBars(currentTf, true);
}

function removeEma(period) {
    if (!emaSeries[period]) return;
    mainChart.removeSeries(emaSeries[period]);
    delete emaSeries[period];
    renderEmaChips();
}

// seed default EMAs
[9, 20, 50].forEach(p => {
    emaSeries[p] = mainChart.addLineSeries({ ...SO, color: EMA_COLORS[[9,20,50].indexOf(p)], lineWidth: 1 });
});
renderEmaChips();

const DASHED = LightweightCharts.LineStyle.Dashed;
const bbUpperSeries = mainChart.addLineSeries({ ...SO, color: 'rgba(230,184,0,0.7)', lineWidth: 1, lineStyle: DASHED });
const bbMidSeries   = mainChart.addLineSeries({ ...SO, color: 'rgba(230,184,0,0.35)', lineWidth: 1, lineStyle: DASHED });
const bbLowerSeries = mainChart.addLineSeries({ ...SO, color: 'rgba(230,184,0,0.7)', lineWidth: 1, lineStyle: DASHED });

// ── Sub-chart factory ────────────────────────────────────────────
function mkSubChart(elId, height) {
    const el = document.getElementById(elId);
    return LightweightCharts.createChart(el, {
        ...BASE_OPTS,
        width:        el.clientWidth,
        height,
        timeScale:    { visible: false },
        handleScale:  false,
        handleScroll: false,
    });
}

const rsiChart   = mkSubChart('rsi-pane',   100);
const macdChart  = mkSubChart('macd-pane',  120);
const stochChart = mkSubChart('stoch-pane', 100);
const adxChart   = mkSubChart('adx-pane',   100);

// RSI series
const rsiSeries = rsiChart.addLineSeries({ ...SO, color: '#e91e63', lineWidth: 1, lastValueVisible: true });
rsiSeries.createPriceLine({ price: 70, color: '#555', lineWidth: 1, lineStyle: DASHED, axisLabelVisible: false });
rsiSeries.createPriceLine({ price: 30, color: '#555', lineWidth: 1, lineStyle: DASHED, axisLabelVisible: false });

// MACD series
const macdLineSeries   = macdChart.addLineSeries({ ...SO, color: '#2196f3', lineWidth: 1 });
const macdSignalSeries = macdChart.addLineSeries({ ...SO, color: '#ff9800', lineWidth: 1 });
const macdHistSeries   = macdChart.addHistogramSeries({ ...SO });

// Stochastic series
const stochKSeries = stochChart.addLineSeries({ ...SO, color: '#4caf50', lineWidth: 1 });
const stochDSeries = stochChart.addLineSeries({ ...SO, color: '#ff5722', lineWidth: 1 });
stochKSeries.createPriceLine({ price: 80, color: '#555', lineWidth: 1, lineStyle: DASHED, axisLabelVisible: false });
stochKSeries.createPriceLine({ price: 20, color: '#555', lineWidth: 1, lineStyle: DASHED, axisLabelVisible: false });

// ADX series
const adxSeries    = adxChart.addLineSeries({ ...SO, color: '#ffffff', lineWidth: 1 });
const adxPosSeries = adxChart.addLineSeries({ ...SO, color: '#4caf50', lineWidth: 1 });
const adxNegSeries = adxChart.addLineSeries({ ...SO, color: '#f44336', lineWidth: 1 });
adxSeries.createPriceLine({ price: 25, color: '#555', lineWidth: 1, lineStyle: DASHED, axisLabelVisible: false });

// ── Time sync ────────────────────────────────────────────────────
const allCharts = [mainChart, rsiChart, macdChart, stochChart, adxChart];
let syncing = false;
allCharts.forEach(src => {
    src.timeScale().subscribeVisibleLogicalRangeChange(range => {
        if (syncing || !range) return;
        syncing = true;
        allCharts.forEach(c => { if (c !== src) c.timeScale().setVisibleLogicalRange(range); });
        syncing = false;
    });
});

// ── Resize ───────────────────────────────────────────────────────
const paneIds = ['chart-container', 'rsi-pane', 'macd-pane', 'stoch-pane', 'adx-pane'];
window.addEventListener('resize', () => {
    allCharts.forEach((c, i) => {
        const el = document.getElementById(paneIds[i]);
        if (el) c.applyOptions({ width: el.clientWidth });
    });
});

// ── Indicator toggles ─────────────────────────────────────────────
const visState = { emas: true, bbands: true, rsi: true, macd: true, stoch: true, adx: true };

document.querySelectorAll('.ind-btn').forEach(btn => {
    btn.addEventListener('click', function () {
        const ind = this.dataset.ind;
        visState[ind] = !visState[ind];
        const v = visState[ind];
        this.style.opacity = v ? '1' : '0.35';
        switch (ind) {
            case 'emas':
                emasVisible = v;
                Object.values(emaSeries).forEach(s => s.applyOptions({ visible: v }));
                break;
            case 'bbands':
                [bbUpperSeries, bbMidSeries, bbLowerSeries].forEach(s => s.applyOptions({ visible: v }));
                break;
            case 'rsi':
                document.getElementById('rsi-pane').style.display = v ? '' : 'none';
                break;
            case 'macd':
                document.getElementById('macd-pane').style.display = v ? '' : 'none';
                break;
            case 'stoch':
                document.getElementById('stoch-pane').style.display = v ? '' : 'none';
                break;
            case 'adx':
                document.getElementById('adx-pane').style.display = v ? '' : 'none';
                break;
        }
    });
});

// ── Load data ────────────────────────────────────────────────────
const allSeries = [
    candleSeries,
    bbUpperSeries, bbMidSeries, bbLowerSeries,
    rsiSeries, macdLineSeries, macdSignalSeries, macdHistSeries,
    stochKSeries, stochDSeries, adxSeries, adxPosSeries, adxNegSeries,
];

let currentTf = '1min';

async function loadBars(timeframe, preserveRange = false) {
    document.getElementById('chart-status').textContent = 'Loading…';

    const savedRange = preserveRange ? mainChart.timeScale().getVisibleLogicalRange() : null;

    const emaPeriods = Object.keys(emaSeries).join(',') || '9,20,50';
    const [barsResp, indResp] = await Promise.all([
        fetch(`/api/asset/${SYMBOL}/bars?timeframe=${timeframe}&limit=300`),
        fetch(`/api/asset/${SYMBOL}/indicators?timeframe=${timeframe}&ema=${emaPeriods}`),
    ]);
    const bars = await barsResp.json();
    const ind  = await indResp.json();

    if (!Array.isArray(bars) || bars.length === 0) {
        allSeries.forEach(s => s.setData([]));
        Object.values(emaSeries).forEach(s => s.setData([]));
        document.getElementById('chart-status').textContent = 'No data for this timeframe.';
        document.getElementById('price-tbody').innerHTML =
            '<tr><td colspan="6" style="text-align:center;color:#999;">No data</td></tr>';
        return;
    }

    candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));

    Object.keys(emaSeries).map(Number).forEach(period => {
        emaSeries[period].setData(ind[`ema_${period}`] || []);
    });

    bbUpperSeries.setData(ind.bb_upper   || []);
    bbMidSeries.setData(ind.bb_middle    || []);
    bbLowerSeries.setData(ind.bb_lower   || []);

    rsiSeries.setData(ind.rsi              || []);
    macdLineSeries.setData(ind.macd        || []);
    macdSignalSeries.setData(ind.macd_signal || []);
    macdHistSeries.setData(ind.macd_hist   || []);
    stochKSeries.setData(ind.stoch_k       || []);
    stochDSeries.setData(ind.stoch_d       || []);
    adxSeries.setData(ind.adx              || []);
    adxPosSeries.setData(ind.adx_pos       || []);
    adxNegSeries.setData(ind.adx_neg       || []);

    if (savedRange) {
        mainChart.timeScale().setVisibleLogicalRange(savedRange);
    } else {
        mainChart.timeScale().fitContent();
    }

    const last = bars[bars.length - 1];
    document.getElementById('chart-status').textContent =
        `${bars.length} bars · last close ${last.close.toFixed(2)} · ${new Date().toLocaleTimeString()}`;

    const tbody = document.getElementById('price-tbody');
    tbody.innerHTML = '';
    [...bars].reverse().slice(0, 50).forEach(b => {
        const label = new Date(b.time * 1000).toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
        tbody.insertAdjacentHTML('beforeend', `<tr>
            <td>${label}</td>
            <td>${b.open.toFixed(2)}</td>
            <td>${b.high.toFixed(2)}</td>
            <td>${b.low.toFixed(2)}</td>
            <td>${b.close.toFixed(2)}</td>
            <td>${b.volume.toLocaleString()}</td>
        </tr>`);
    });
}

// ── EMA add button ────────────────────────────────────────────────
document.getElementById('ema-add-btn').addEventListener('click', () => {
    const input  = document.getElementById('ema-input');
    const period = parseInt(input.value);
    if (!period || period < 2 || period > 500) return;
    addEma(period);
    input.value = '';
});
document.getElementById('ema-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('ema-add-btn').click();
});

// ── Timeframe buttons ─────────────────────────────────────────────
document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.addEventListener('click', function () {
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentTf = this.dataset.tf;
        loadBars(currentTf);
    });
});

loadBars(currentTf);

// ── Auto-refresh every 60 seconds (preserves zoom/scroll position) ─
setInterval(() => loadBars(currentTf, true), 60_000);
</script>
{% endblock %}
