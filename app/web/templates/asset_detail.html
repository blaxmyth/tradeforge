{% extends "layout.html" %}

{% block content %}
<div class="asset-label" style="margin-bottom: 16px;">
    <h2><a href="/assets">Assets</a> >> {{ asset.symbol }} >> {{ asset.name }}</h2>
    <form method="POST" action="/apply_strategy" style="display:inline-block;">
        <select name="strategy_id" class="ui dropdown">
            {% for strategy in strategies %}
            <option value="{{strategy.id}}">{{strategy.name}}</option>
            {% endfor %}
        </select>
        <input type="hidden" name="asset_id" value="{{ asset.id }}">
        <input type="submit" value="Apply Strategy" class="ui button">
    </form>
</div>

<div style="margin-bottom: 8px;">
    <div class="ui small buttons">
        <button class="ui button tf-btn active" data-tf="1min">1 Min</button>
        <button class="ui button tf-btn" data-tf="5min">5 Min</button>
        <button class="ui button tf-btn" data-tf="15min">15 Min</button>
        <button class="ui button tf-btn" data-tf="1hr">1 Hr</button>
        <button class="ui button tf-btn" data-tf="1day">1 Day</button>
    </div>
</div>

<div id="chart-container" style="width:100%; height:500px; border-radius:4px; overflow:hidden;"></div>
<div id="chart-status" style="color:#999; font-size:12px; margin: 6px 0 20px;"></div>

<div class="tradingview-widget-container" style="margin-bottom: 24px;">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "width": "100%",
            "height": 500,
            "symbol": "{{asset.exchange}}:{{asset.symbol}}",
            "interval": "1",
            "timezone": "America/New_York",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": false,
            "container_id": "tradingview_detail"
        });
    </script>
</div>

<table class="ui striped compact table">
    <thead>
        <tr>
            <th>Time (ET)</th>
            <th>Open</th>
            <th>High</th>
            <th>Low</th>
            <th>Close</th>
            <th>Volume</th>
        </tr>
    </thead>
    <tbody id="price-tbody">
        <tr><td colspan="6" style="text-align:center; color:#999;">Loading…</td></tr>
    </tbody>
</table>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
    const SYMBOL = "{{ asset.symbol }}";
    let chart, candleSeries;

    function initChart() {
        const container = document.getElementById('chart-container');
        chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: 500,
            layout: {
                background: { color: '#1a1a2e' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2a2a3e' },
                horzLines: { color: '#2a2a3e' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#2a2a3e',
            },
            rightPriceScale: {
                borderColor: '#2a2a3e',
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
        });

        candleSeries = chart.addCandlestickSeries({
            upColor:     '#26a69a',
            downColor:   '#ef5350',
            borderVisible: false,
            wickUpColor:   '#26a69a',
            wickDownColor: '#ef5350',
        });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: container.clientWidth });
        });
    }

    async function loadBars(timeframe) {
        document.getElementById('chart-status').textContent = 'Loading…';

        const resp = await fetch(`/api/asset/${SYMBOL}/bars?timeframe=${timeframe}&limit=300`);
        const bars = await resp.json();

        if (!Array.isArray(bars) || bars.length === 0) {
            candleSeries.setData([]);
            document.getElementById('chart-status').textContent = 'No data available for this timeframe yet.';
            document.getElementById('price-tbody').innerHTML =
                '<tr><td colspan="6" style="text-align:center; color:#999;">No data</td></tr>';
            return;
        }

        candleSeries.setData(bars.map(b => ({
            time: b.time,
            open: b.open,
            high: b.high,
            low: b.low,
            close: b.close,
        })));

        chart.timeScale().fitContent();

        const last = bars[bars.length - 1];
        document.getElementById('chart-status').textContent =
            `${bars.length} bars  ·  last close ${last.close.toFixed(2)}  ·  updated ${new Date().toLocaleTimeString()}`;

        const tbody = document.getElementById('price-tbody');
        tbody.innerHTML = '';
        [...bars].reverse().slice(0, 50).forEach(b => {
            const d = new Date(b.time * 1000);
            const label = d.toLocaleString('en-US', { timeZone: 'America/New_York', hour12: false });
            tbody.insertAdjacentHTML('beforeend', `<tr>
                <td>${label}</td>
                <td>${b.open.toFixed(2)}</td>
                <td>${b.high.toFixed(2)}</td>
                <td>${b.low.toFixed(2)}</td>
                <td>${b.close.toFixed(2)}</td>
                <td>${b.volume.toLocaleString()}</td>
            </tr>`);
        });
    }

    document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadBars(this.dataset.tf);
        });
    });

    initChart();
    loadBars('1min');
</script>
{% endblock %}
