services:
  nginx-proxy:
    volumes:
      - ./app/web/proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    # Checks for renewal daily; reloads Nginx automatically if a cert is renewed
    entrypoint: "/bin/sh -c 'apk add --no-cache docker-cli -q; trap exit TERM; while :; do certbot renew --deploy-hook \"docker exec nginx-proxy nginx -s reload\"; sleep 24h & wait $${!}; done;'"
    networks:
      - tradeforge_net
